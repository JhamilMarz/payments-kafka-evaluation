services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: bnb-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "@Passw0rd"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q ''SELECT 1'' || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: bnb-db-init
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: "@Passw0rd"
    volumes:
      - ./db:/scripts:ro
    entrypoint: >
      bash -c "/opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -i /scripts/init.sql"
    restart: "no"

  api:
    build: .
    container_name: bnb-payments-api
    depends_on:
      db-init:
        condition: service_completed_successfully
      #kafka:
      #condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=PaymentsDb;User Id=sa;Password=@Passw0rd;TrustServerCertificate=True;"
      #Kafka__BootstrapServers: "kafka:9092"
      #Kafka__Topic: "payments.created"
      #Kafka__Enabled: "true"
    ports:
      - "8080:8080"

volumes:
  mssql-data: # datos SQL Server (persisten aunque borres contenedores)
  #kafka-data:      # datos Kafka
